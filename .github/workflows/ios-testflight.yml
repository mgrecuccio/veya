name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  upload-testflight:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decode Firebase app config
        run: echo "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Build web app
        run: npm run build:prod

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Create App Store Connect API key
        run: |
          mkdir -p "$HOME/.private_keys"
          app_store_connect_api_key_path="$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > "$app_store_connect_api_key_path"
          test -s "$app_store_connect_api_key_path"

      - name: Install iOS signing assets
        run: |
          certificate_path="$RUNNER_TEMP/ios_distribution.p12"
          provisioning_profile_path="$RUNNER_TEMP/Veya_App_Store.mobileprovision"
          provisioning_profile_plist_path="$RUNNER_TEMP/Veya_App_Store.plist"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          echo "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}" | base64 --decode > "$certificate_path"
          echo "${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$provisioning_profile_path"
          test -s "$certificate_path"
          test -s "$provisioning_profile_path"

          security create-keychain -p "${{ secrets.IOS_KEYCHAIN_PASSWORD }}" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "${{ secrets.IOS_KEYCHAIN_PASSWORD }}" "$keychain_path"
          security import "$certificate_path" -P "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.IOS_KEYCHAIN_PASSWORD }}" "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$provisioning_profile_path" > "$provisioning_profile_plist_path"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$provisioning_profile_plist_path")"
          cp "$provisioning_profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

      - name: Archive app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Veya.xcarchive \
            DEVELOPMENT_TEAM=3ZYYQQB6L8 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_ID" \
            PROVISIONING_PROFILE_SPECIFIER="Veya App Store"

      - name: Create export options
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>3ZYYQQB6L8</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mgrtech.veya</key>
              <string>Veya App Store</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Veya.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: veya-ios-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/export/*.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
