<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom" class="app-tab-bar">
    <ion-tab-button tab="home" [routerLink]="['/app/home']" routerDirection="root">
      <ion-icon name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="contacts" routerDirection="root">
      <ion-icon name="people"></ion-icon>
      <ion-label>Contacts</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="availability" routerDirection="root">
      <ion-icon name="calendar"></ion-icon>
      <ion-label>Availability</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" routerDirection="root">
      <ion-icon name="settings"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
