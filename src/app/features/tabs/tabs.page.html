<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom" class="app-tab-bar">
    <ion-tab-button tab="home" [routerLink]="['/app/home']" routerDirection="root">
      <ion-icon name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="contacts" [routerLink]="['/app/contacts']" routerDirection="root">
      <ion-icon name="people"></ion-icon>
      <ion-label>Contacts</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="matches" [routerLink]="['/app/matches']" routerDirection="root">
      <ion-icon name="heart"></ion-icon>
      <ion-label>Matches</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="availability" [routerLink]="['/app/availability']" routerDirection="root">
      <ion-icon name="calendar"></ion-icon>
      <ion-label>Availability</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
