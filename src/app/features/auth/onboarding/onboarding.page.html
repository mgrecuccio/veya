<ion-content class="app-gradient-content" [fullscreen]="true" [scrollY]="false">
  <div class="app-page onboarding-page">

    <div class="onboarding-main">
      <!-- HERO -->
      <div class="hero">

        <div class="hero-brand">Veya</div>

        <img class="hero-visual__image" src="assets/onboarding/header_card.png" alt="Friends reconnecting" />

        <h1 class="hero-title">
          Reconnect with your friends,<br />
          <span>when you're both free!</span>
        </h1>

        <p class="cta-text">Join Veya and make plans in the moment!</p>
      </div>

      <!-- FEATURES -->
      <ul class="feature-list">
        <li class="feature-row">
          <span class="feature-row__icon" aria-hidden="true">
            <ion-icon name="people-outline"></ion-icon>
          </span>
          <span class="feature-row__copy">
            <strong class="feature-row__title">Connect with friends</strong>
            <span class="feature-row__text">Invite and chat with trusted contacts.</span>
          </span>
        </li>

        <li class="feature-row">
          <span class="feature-row__icon" aria-hidden="true">
            <ion-icon name="sparkles-outline"></ion-icon>
          </span>
          <span class="feature-row__copy">
            <strong class="feature-row__title">Meet up spontaneously</strong>
            <span class="feature-row__text">Find the best time to reconnect.</span>
          </span>
        </li>
      </ul>
    </div>

    <!-- ACTIONS -->
    <div class="onboarding-footer">
      <app-primary-button (buttonClick)="goToRegister()">Get started</app-primary-button>

      <p class="login-prompt">
        Already have an account?
        <button type="button" class="login-prompt__link" (click)="goToLogin()">Log in</button>
      </p>
    </div>
  </div>
</ion-content>
