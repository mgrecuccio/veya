<ion-content class="app-gradient-content matches-content" [fullscreen]="true" [scrollY]="true">
  <header class="app-page-topbar">
    <div class="app-page-brand">Veya</div>

    <ion-button
      class="page-settings-button page-settings-button--topbar"
      aria-label="Open settings"
      title="Settings preview"
      routerLink="/settings"
      routerDirection="forward"
    >
      <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
    </ion-button>
  </header>

  <div class="app-page matches-page">
    <div class="matches-shell">
      <section class="app-surface matches-hero">
        <div class="matches-hero__glow"></div>

        <div class="matches-hero__content">
          <p class="matches-hero__eyebrow">Ready to reconnect</p>
          <h1 class="matches-hero__title">Your matches</h1>
          <p class="matches-hero__subtitle">
            Accepted matches will appear here when your availability lines up.
          </p>
        </div>
      </section>

      <section class="app-surface matches-card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Accepted matches</h2>
            <p class="card-subtitle">
              Preview data for the future matching experience.
            </p>
          </div>

          <div class="match-count">{{ matches.length }}</div>
        </div>

        <div class="match-list">
          @for (match of matches; track match.id) {
            <article class="match-item">
              <div class="match-avatar">{{ match.initials }}</div>

              <div class="match-copy">
                <strong class="match-name">{{ match.name }}</strong>
                <span class="match-status">Match accepted</span>
              </div>

              <ion-button
                size="small"
                class="chat-button"
                (click)="previewChat()"
                [attr.aria-label]="'Chat with ' + match.name + ' on WhatsApp'"
              >
                <ion-icon slot="start" name="logo-whatsapp"></ion-icon>
                Chat
              </ion-button>
            </article>
          }
        </div>
      </section>
    </div>
  </div>

</ion-content>
